plugins { id 'com.android.application' }

android { namespace 'com.cinelog.app'; compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.cinelog.app'; minSdk 23; targetSdk 35; versionCode 7; versionName '1.6'
        // This homework build treats the current PC as the local server.
        // Override with -PAPI_BASE_URL=... only if the LAN address changes.
        buildConfigField 'String', 'API_BASE_URL', '"' + (project.findProperty('API_BASE_URL') ?: 'http://10.29.63.116:8000') + '"'
    }
}
