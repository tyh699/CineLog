<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <title>CineLog — 片单与观影日志</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extras.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="CineLog 首页"><span class="brand-mark">C</span><span>CineLog<small>YOUR SCREEN JOURNAL</small></span></a>
      <div class="side-label">LIBRARY</div>
      <nav class="nav-list" aria-label="主要导航">
        <button class="nav-item active" data-view="home"><span>◫</span>总览</button>
        <button class="nav-item" data-view="movies"><span>▣</span>电影日志 <b id="movie-count">0</b></button>
        <button class="nav-item" data-view="series"><span>▤</span>剧集日志 <b id="series-count">0</b></button>
        <button class="nav-item" data-view="wishlist"><span>♡</span>想看清单 <b id="wish-count">0</b></button>
        <button class="nav-item" data-view="discover"><span>✦</span>发现</button>
        <button class="nav-item" data-view="stats"><span>▥</span>观影统计</button>
        <button class="nav-item" data-view="tags"><span>⌗</span>标签管理</button>
      </nav>
      <div class="sidebar-bottom"><div class="avatar">L</div><div><strong>本地观影档案</strong><small>数据仅保存在此设备</small></div><button class="icon-button" id="settings-button" aria-label="设置">⚙</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumb"><span>LIBRARY</span><i>/</i><strong id="view-label">总览</strong></div><div class="top-actions"><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="搜索片名、评论、标签…" aria-label="搜索"></label><button class="primary-button" id="add-button"><span>＋</span> 添加条目</button></div></header>
      <section id="content" class="content-area"></section>
    </main>
  </div>
  <dialog id="entry-dialog" class="modal">
    <form id="entry-form" method="dialog">
      <div class="modal-head"><div><div class="eyebrow">YOUR JOURNAL</div><h2 id="dialog-title">添加观影记录</h2></div><button class="icon-button" type="button" data-close aria-label="关闭">×</button></div>
      <div class="type-switch"><button type="button" class="type-option selected" data-type="movie">电影</button><button type="button" class="type-option" data-type="series">剧集</button></div>
      <label class="field">片名<input name="title" required maxlength="80" placeholder="例如：花样年华"></label>
      <div class="form-row"><label class="field">状态<select name="status"><option value="watched">已看</option><option value="wishlist">想看</option></select></label><label class="field">日期<input name="date" type="date"></label></div>
      <div id="review-fields"><label class="field">评分 <span class="subtle">点击星星评分</span><div class="rating-picker" role="radiogroup" aria-label="评分"><button type="button" data-rating="1">★</button><button type="button" data-rating="2">★</button><button type="button" data-rating="3">★</button><button type="button" data-rating="4">★</button><button type="button" data-rating="5">★</button><span id="rating-value">未评分</span></div></label><label class="field">短评<textarea name="review" rows="3" maxlength="400" placeholder="这部作品给你留下了什么印象？"></textarea></label></div>
      <label class="field">标签 <span class="subtle">用逗号分隔，可新建</span><input name="tags" placeholder="例如：科幻, 周末"></label>
      <div class="modal-footer"><button class="quiet-button" type="button" data-close>取消</button><button class="primary-button" type="submit">保存条目 <span>↗</span></button></div>
    </form>
  </dialog>
  <dialog id="tag-dialog" class="modal small-modal"><form id="tag-form" method="dialog"><div class="modal-head"><div><div class="eyebrow">ORGANIZE</div><h2>创建标签</h2></div><button class="icon-button" type="button" data-close aria-label="关闭">×</button></div><label class="field">标签名称<input name="name" required maxlength="30" placeholder="例如：值得重看"></label><div class="field">应用范围<div class="check-row"><label><input type="checkbox" name="forMovie" checked> 电影</label><label><input type="checkbox" name="forSeries" checked> 剧集</label></div></div><div class="modal-footer"><button class="quiet-button" type="button" data-close>取消</button><button class="primary-button" type="submit">保存标签</button></div></form></dialog>
  <dialog id="detail-dialog" class="modal detail-modal"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
